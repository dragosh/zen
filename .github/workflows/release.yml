name: release

# A v* tag builds the universal Developer ID DMG, notarises and staples it, and
# publishes it on the GitHub release of that tag (notes from CHANGELOG.md).
# Run by hand (workflow_dispatch) it does the same but only keeps the DMG as a
# workflow artifact: a dry run of signing and notarisation.
#
# Repository secrets (docs/DISTRIBUTION.md, "Signing in CI"):
#   MACOS_CERT_P12_BASE64   the Developer ID Application certificate and key, .p12, base64
#   MACOS_CERT_PASSWORD     the .p12 export password
#   NOTARY_KEY_P8_BASE64    an App Store Connect API key (.p8), base64
#   NOTARY_KEY_ID           its key ID
#   NOTARY_ISSUER           its issuer ID
# Repository variables:
#   SIGN_IDENTITY           "Developer ID Application: Name (TEAMID)"
#   ADDONS                  overrides the add-ons of the build, e.g. "vale" (specs/kit/addons);
#                           empty or unset: the app's app-assembly.yml decides. The release
#                           notes list them.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      SIGN_IDENTITY: ${{ vars.SIGN_IDENTITY }}
      ADDONS: ${{ vars.ADDONS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0

      - name: tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          v="$(cat VERSION)"
          test "$GITHUB_REF_NAME" = "v$v" || { echo "::error::Tag $GITHUB_REF_NAME does not match VERSION $v"; exit 1; }

      - name: signing inputs present
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: |
          missing=""
          for n in SIGN_IDENTITY P12 P12_PASSWORD P8 KEY_ID ISSUER; do
            eval "val=\${$n}"
            [ -n "$val" ] || missing="$missing $n"
          done
          [ -z "$missing" ] || { echo "::error::Missing signing inputs:$missing (see docs/DISTRIBUTION.md, Signing in CI)"; exit 1; }

      # A throwaway keychain holding only the Developer ID certificate; deleted at the end.
      - name: keychain
        env:
          P12: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          P8: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(openssl rand -hex 24)"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          printf '%s' "$P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kcpass" "$kc" >/dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$kc"

      - name: build, sign, notarise
        env:
          NOTARY_KEY: ${{ runner.temp }}/notary.p8
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: wails3 task release

      - uses: actions/upload-artifact@v7
        with:
          name: zenmark-dmg
          path: |
            bin/Zenmark-*.dmg
            bin/Zenmark-*.dmg.sha256

      - name: publish
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: wails3 task release:publish

      - name: clean up
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/cert.p12"
