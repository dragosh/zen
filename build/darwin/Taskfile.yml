version: '3'

includes:
  common: ../Taskfile.yml

vars:
  # Docker image for cross-compilation (used when building on non-macOS)
  CROSS_IMAGE: wails-cross
  # The bundle is Zen.app; the executable inside stays `zen` (APP_NAME).
  BUNDLE_NAME: Zen
  BUNDLE: '{{.BIN_DIR}}/{{.BUNDLE_NAME}}.app'
  # Signing identity. "-" = ad-hoc (alpha). For a Developer ID build:
  #   task package SIGN_IDENTITY="Developer ID Application: Name (TEAMID)"
  # which also enables the hardened runtime and a secure timestamp.
  SIGN_IDENTITY: '{{.SIGN_IDENTITY | default "-"}}'
  # Release channel (specs/packaging/appstore/spec.md):
  #   devid    (default) Developer ID: full feature set, not sandboxed, .dmg, notarised.
  #   appstore Mac App Store: sandboxed, built with -tags appstore, .pkg for Transporter.
  # Inputs come from the environment, never from the repository:
  #   SIGN_IDENTITY, TEAM_ID, PROFILE (provisioning profile), INSTALLER_IDENTITY,
  #   KEYCHAIN_PROFILE (notarytool); sign.sh embeds PROFILE as Contents/embedded.provisionprofile; ADHOC=1 makes a local, unsignable appstore dry run.
  CHANNEL: '{{.CHANNEL | default "devid"}}'
  CHANNEL_TAGS: '{{if eq .CHANNEL "appstore"}}appstore{{end}}'
  # The product name shown to users comes from build/config.yml (info.productName).
  # The bundle (bin/Zen.app) and the DMG name keep BUNDLE_NAME.

tasks:
  build:
    summary: Builds the application
    cmds:
      # The experimental CGO-free backend (-tags purego, or WAILS_PUREGO=1) needs
      # no C toolchain, so it builds natively on every host; cgo builds
      # cross-compile through Docker.
      - task: '{{if or (eq OS "darwin") (has "purego" (splitList "," (.EXTRA_TAGS | default "")))}}build:native{{else}}build:docker{{end}}'
        vars:
          ARCH: '{{.ARCH}}'
          DEV: '{{.DEV}}'
          OUTPUT: '{{.OUTPUT}}'
          EXTRA_TAGS: '{{if .CHANNEL_TAGS}}{{if .EXTRA_TAGS}}{{.EXTRA_TAGS}},{{end}}{{.CHANNEL_TAGS}}{{else}}{{.EXTRA_TAGS}}{{end}}'
          OBFUSCATED: '{{.OBFUSCATED}}'
          GARBLE_ARGS: '{{.GARBLE_ARGS}}'
    vars:
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  build:native:
    summary: Builds the application natively (on macOS, or anywhere with -tags purego)
    internal: true
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
          DEV:
            ref: .DEV
      - task: common:generate:icons
    preconditions:
      - sh: '{{if eq .OBFUSCATED "true"}}command -v garble >/dev/null 2>&1{{else}}true{{end}}'
        msg: "garble is required for obfuscated builds. Install it with: go install mvdan.cc/garble@v0.16.0 (requires Go 1.24+). See https://github.com/burrowers/garble/releases for version/toolchain compatibility."
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - '{{if eq .OBFUSCATED "true"}}garble {{.GARBLE_ARGS}} build{{else}}go build{{end}} {{.BUILD_FLAGS}} -o "{{.OUTPUT}}"'
    vars:
      BUILD_FLAGS: '{{if eq .DEV "true"}}{{if or .EXTRA_TAGS (eq .OBFUSCATED "true")}}-tags {{if eq .OBFUSCATED "true"}}wails_obfuscated{{if .EXTRA_TAGS}},{{end}}{{end}}{{.EXTRA_TAGS}} {{end}}-buildvcs=false -gcflags=all="-l" -ldflags="{{.VERSION_LDFLAGS}}"{{else}}-tags production{{if eq .OBFUSCATED "true"}},wails_obfuscated{{end}}{{if .EXTRA_TAGS}},{{.EXTRA_TAGS}}{{end}} -trimpath -buildvcs=false -ldflags="-w -s {{.VERSION_LDFLAGS}}"{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
    env:
      GOOS: darwin
      CGO_ENABLED: '{{if (has "purego" (splitList "," (.EXTRA_TAGS | default "")))}}0{{else}}1{{end}}'
      GOARCH: '{{.ARCH | default ARCH}}'
      CGO_CFLAGS: "-mmacosx-version-min=13.0"
      CGO_LDFLAGS: "-mmacosx-version-min=13.0"
      MACOSX_DEPLOYMENT_TARGET: "13.0"

  build:docker:
    summary: Cross-compiles for macOS using Docker (for Linux/Windows hosts)
    internal: true
    deps:
      - task: common:build:frontend
        vars:
          OBFUSCATED:
            ref: .OBFUSCATED
      - task: common:generate:icons
    preconditions:
      - sh: docker info > /dev/null 2>&1
        msg: "Docker is required for cross-compilation. Please install Docker."
      - sh: docker image inspect {{.CROSS_IMAGE}} > /dev/null 2>&1
        msg: |
          Docker image '{{.CROSS_IMAGE}}' not found.
          Build it first: wails3 task setup:docker
    cmds:
      - docker run --rm -v "{{.ROOT_DIR}}:/app" {{.DOCKER_MOUNTS}} -e APP_NAME="{{.APP_NAME}}" {{if .EXTRA_TAGS}}-e EXTRA_TAGS="{{.EXTRA_TAGS}}"{{end}} {{if eq .OBFUSCATED "true"}}-e OBFUSCATED=true{{end}} {{if .GARBLE_ARGS}}-e GARBLE_ARGS="{{.GARBLE_ARGS}}"{{end}} {{.CROSS_IMAGE}} darwin {{.DOCKER_ARCH}}
      - cmd: docker run --rm -v "{{.ROOT_DIR}}:/app" alpine chown -R $(id -u):$(id -g) /app/bin
        platforms: [linux, darwin]
      - mkdir -p {{.BIN_DIR}}
      - mv "bin/{{.APP_NAME}}-darwin-{{.DOCKER_ARCH}}" "{{.OUTPUT}}"
    vars:
      DOCKER_ARCH: '{{if eq .ARCH "arm64"}}arm64{{else if eq .ARCH "amd64"}}amd64{{else}}arm64{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'
      # Generate Docker volume mounts: Go module cache + go.mod replace directives
      # Uses wails3 tool docker-mounts for cross-platform compatibility (Windows/Linux/macOS)
      DOCKER_MOUNTS:
        sh: 'wails3 tool docker-mounts'

  build:universal:
    summary: Builds darwin universal binary (arm64 + amd64)
    deps:
      - task: build
        vars:
          ARCH: amd64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-amd64"
      - task: build
        vars:
          ARCH: arm64
          OUTPUT: "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
    cmds:
      - task: '{{if eq OS "darwin"}}build:universal:lipo:native{{else}}build:universal:lipo:go{{end}}'

  build:universal:lipo:native:
    summary: Creates universal binary using native lipo (macOS)
    internal: true
    cmds:
      - lipo -create -output "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  build:universal:lipo:go:
    summary: Creates universal binary using wails3 tool lipo (Linux/Windows)
    internal: true
    cmds:
      - wails3 tool lipo -output "{{.BIN_DIR}}/{{.APP_NAME}}" -input "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" -input "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"
      - rm -f "{{.BIN_DIR}}/{{.APP_NAME}}-amd64" "{{.BIN_DIR}}/{{.APP_NAME}}-arm64"

  check:channel:
    internal: true
    summary: Fails early, with a clear message, when the inputs of CHANNEL are missing
    cmds:
      - CHANNEL="{{.CHANNEL}}" ADHOC="{{.ADHOC}}" sh build/darwin/check-channel.sh "{{.STEP | default "sign"}}"

  package:
    summary: Packages the application into a `.app` bundle (CHANNEL=devid|appstore, host architecture)
    cmds:
      - task: check:channel
      - task: build
      - task: create:app:bundle

  package:universal:
    summary: Packages darwin universal binary (arm64 + amd64) with universal helpers
    cmds:
      - task: check:channel
      - task: build:universal
      - task: create:app:bundle
        vars:
          HELPER_ARCH: universal

  package:dmg:
    summary: Packages the Developer ID build into a styled `.dmg`
    preconditions:
      - sh: test "{{.CHANNEL}}" = devid
        msg: "A .dmg is the Developer ID package; the App Store build is a .pkg (task package:appstore)."
    cmds:
      - task: package
      - task: create:dmg

  package:appstore:
    summary: Builds the sandboxed Mac App Store bundle and bin/Zen.pkg for Transporter (needs SIGN_IDENTITY, TEAM_ID, PROFILE, INSTALLER_IDENTITY, or ADHOC=1 for a dry run)
    cmds:
      # A child task process: CHANNEL on its command line reaches every task.
      - '{{.TASK_EXE}} darwin:package:universal CHANNEL=appstore ADHOC="{{.ADHOC}}"'
      - CHANNEL=appstore ADHOC="{{.ADHOC}}" sh build/darwin/check-channel.sh pkg
      - task: appstore:pkg

  appstore:pkg:
    internal: true
    summary: productbuild makes bin/Zen.pkg from the signed bundle (skipped for ADHOC=1)
    cmds:
      - |
        if [ "{{.ADHOC}}" = "1" ]; then
          echo "ADHOC=1: not building {{.BIN_DIR}}/{{.BUNDLE_NAME}}.pkg (an ad-hoc signed bundle cannot be uploaded)"
        else
          rm -f "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.pkg"
          productbuild --component "{{.BUNDLE}}" /Applications --sign "{{.INSTALLER_IDENTITY}}" "{{.BIN_DIR}}/{{.BUNDLE_NAME}}.pkg"
          echo "Validate before upload: xcrun altool --validate-app -f {{.BIN_DIR}}/{{.BUNDLE_NAME}}.pkg -t macos (or open it in Transporter)."
        fi

  art:
    summary: Regenerates the DMG art (dmg-background*.png, dmg-file-icon.icns) from build/appicon.svg and appicon.png
    platforms: [darwin]
    cmds:
      - go run ./build/darwin/dmgart

  create:dmg:
    summary: Creates a configurable `.dmg` from the `.app` bundle
    platforms: [darwin]
    cmds:
      - >-
        wails3 tool package --format dmg --name "{{.BUNDLE_NAME}}" --out "{{.BIN_DIR}}"
        --background "{{.DMG_BACKGROUND}}"
        --volume-icon "{{.DMG_VOLUME_ICON}}"
        --file-icon "{{.DMG_FILE_ICON}}"
        --window-width "{{.DMG_WINDOW_WIDTH}}"
        --window-height "{{.DMG_WINDOW_HEIGHT}}"
        {{if .DMG_FILES}}--files "{{.DMG_FILES}}"{{end}}
    vars:
      DMG_BACKGROUND: '{{.DMG_BACKGROUND | default "build/darwin/dmg-background.png"}}'
      DMG_VOLUME_ICON: '{{.DMG_VOLUME_ICON | default "build/darwin/icons.icns"}}'
      DMG_FILE_ICON: '{{.DMG_FILE_ICON | default "build/darwin/dmg-file-icon.icns"}}'
      DMG_WINDOW_WIDTH: '{{.DMG_WINDOW_WIDTH | default "540"}}'
      DMG_WINDOW_HEIGHT: '{{.DMG_WINDOW_HEIGHT | default "380"}}'
      DMG_FILES: '{{.DMG_FILES | default ""}}'


  create:app:bundle:
    summary: Creates bin/Zen.app (binary, Info.plist from VERSION, icon, helpers from resources.yml) and signs it
    vars:
      # docs/VERSIONING.md: short version = MAJOR.MINOR.PATCH, build = commit count.
      SHORT_VERSION:
        sh: sed -E 's/^([0-9]+\.[0-9]+\.[0-9]+).*/\1/' "{{.ROOT_DIR}}/VERSION"
      BUILD_NUMBER:
        sh: git -C "{{.ROOT_DIR}}" rev-list --count HEAD 2>/dev/null || echo 1
      HELPER_ARCH: '{{.HELPER_ARCH | default (.ARCH | default ARCH)}}'
    cmds:
      # A reused bundle can acquire Finder metadata in synced folders. Build a
      # fresh bundle so codesign never has to replace a contaminated signature.
      - test -n "{{.BIN_DIR}}" && test -n "{{.BUNDLE_NAME}}" && rm -rf -- "{{.BUNDLE}}"
      - mkdir -p "{{.BUNDLE}}/Contents/MacOS" "{{.BUNDLE}}/Contents/Resources" "{{.BUNDLE}}/Contents/Helpers"
      # Download the pinned helpers (skipped when already verified), then verify
      # every helper in resources.yml (file exists, sha256 matches) and copy it
      # with its license notice.
      - task: fetch:helpers
        vars:
          ARCH: '{{.HELPER_ARCH}}'
      - go run ./build/darwin/resources -manifest resources.yml -arch "{{.HELPER_ARCH}}" -dest "{{.BUNDLE}}/Contents/Helpers" -licenses "{{.BUNDLE}}/Contents/Resources/licenses"
      - cp build/darwin/icons.icns "{{.BUNDLE}}/Contents/Resources"
      - cp build/darwin/PrivacyInfo.xcprivacy "{{.BUNDLE}}/Contents/Resources/PrivacyInfo.xcprivacy"
      - task: icon:assets
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BUNDLE}}/Contents/MacOS/{{.APP_NAME}}"
      # Info.plist: version, build number, name, bundle id, copyright and category
      # come from VERSION, git and build/config.yml.
      - go run ./build/darwin/plist -config build/config.yml -template build/darwin/Info.plist -version "{{.SHORT_VERSION}}" -build "{{.BUILD_NUMBER}}" -out "{{.BUNDLE}}/Contents/Info.plist"
      - plutil -lint "{{.BUNDLE}}/Contents/Info.plist"
      - task: '{{if eq OS "darwin"}}codesign{{else}}codesign:skip{{end}}'

  icon:assets:
    summary: Puts the asset catalog (Assets.car with `appicon`, compiled from build/appicon.icon by actool) into the bundle
    desc: |
      The catalog needs `actool` (full Xcode 26 or later; the Command Line Tools do not have it).
      Without it: CHANNEL=appstore fails (the store needs the catalog); CHANNEL=devid warns and the
      bundle keeps icons.icns only (macOS 13-14 look).
    internal: true
    cmds:
      - |
        res="{{.BUNDLE}}/Contents/Resources"
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "$res"
        elif xcrun --find actool >/dev/null 2>&1; then
          out="$(mktemp -d)"
          xcrun actool build/appicon.icon --compile "$out" --output-format human-readable-text \
            --output-partial-info-plist /dev/null --app-icon appicon --include-all-app-icons \
            --enable-on-demand-resources NO --development-region en --target-device mac \
            --minimum-deployment-target 13.0 --platform macosx
          cp "$out/Assets.car" "$res/Assets.car"
          rm -rf "$out"
        elif [ "{{.CHANNEL}}" = "appstore" ]; then
          echo "zen: CHANNEL=appstore needs Assets.car, and actool is not available (install full Xcode)." >&2
          exit 1
        else
          echo "zen: warning: actool is not available (full Xcode); the bundle has icons.icns but no Assets.car." >&2
        fi

  fetch:helpers:
    summary: Downloads the helpers in resources.yml for ARCH (default host) into build/darwin/helpers/<arch>/, checking tarball and binary sha256; skipped when the verified binary is already there
    vars:
      HELPER_ARCH: '{{.ARCH | default ARCH}}'
    cmds:
      - go run ./build/darwin/resources -manifest resources.yml -arch "{{.HELPER_ARCH}}" -fetch

  codesign:
    summary: Signs Zen.app for CHANNEL with SIGN_IDENTITY (default ad-hoc); see build/darwin/sign.sh (macOS only)
    internal: true
    cmds:
      - CHANNEL="{{.CHANNEL}}" SIGN_IDENTITY="{{.SIGN_IDENTITY}}" TEAM_ID="{{.TEAM_ID}}" PROFILE="{{.PROFILE}}" ADHOC="{{.ADHOC}}" sh build/darwin/sign.sh "{{.BUNDLE}}"

  codesign:skip:
    summary: Skips codesigning when cross-compiling
    internal: true
    cmds:
      - 'echo "Skipping codesign (not available on {{OS}}). Sign the .app on macOS before distribution."'

  package:test:
    summary: Packages Zen.app for CHANNEL and runs the bundle tests against it (ZEN_UNIVERSAL=1 with ARCH=universal)
    cmds:
      - task: '{{if eq .CHANNEL "appstore"}}package:universal{{else if eq .ARCH "universal"}}package:universal{{else}}package{{end}}'
      - ZEN_CHANNEL="{{.CHANNEL}}" ZEN_ADHOC="{{.ADHOC}}" ZEN_UNIVERSAL="{{if or (eq .CHANNEL "appstore") (eq .ARCH "universal")}}1{{end}}" ZEN_REQUIRE_BUNDLE=1 go test -count=1 ./build/darwin

  icon:
    summary: Regenerates build/appicon.png from build/appicon.svg (macOS QuickLook) and the DMG art; `task package` then rebuilds icons.icns
    platforms: [darwin]
    cmds:
      - rm -rf .task/appicon && mkdir -p .task/appicon
      - qlmanage -t -s 1024 -o .task/appicon build/appicon.svg >/dev/null
      - go run ./build/darwin/iconmask .task/appicon/appicon.svg.png build/appicon.png
      - rm -rf .task/appicon
      - task: art

  install:cli:
    summary: Links INSTALL_DIR/zen (default /usr/local/bin) to the zen binary inside the installed Zen.app (APP_PATH, default /Applications/Zen.app)
    vars:
      INSTALL_DIR: '{{.INSTALL_DIR | default "/usr/local/bin"}}'
      APP_PATH: '{{.APP_PATH | default "/Applications/Zen.app"}}'
    preconditions:
      - sh: test -x "{{.APP_PATH}}/Contents/MacOS/{{.APP_NAME}}"
        msg: "{{.APP_PATH}} not found. Copy bin/Zen.app to /Applications first (or set APP_PATH)."
    cmds:
      - mkdir -p "{{.INSTALL_DIR}}"
      - ln -sfn "{{.APP_PATH}}/Contents/MacOS/{{.APP_NAME}}" "{{.INSTALL_DIR}}/{{.APP_NAME}}"
      - echo "Linked {{.INSTALL_DIR}}/{{.APP_NAME}} -> {{.APP_PATH}}/Contents/MacOS/{{.APP_NAME}}"

  run:
    cmds:
      - wails3 tool prepare-macos-output --dir "{{.BIN_DIR}}"
      - test -n "{{.BIN_DIR}}" && test -n "{{.APP_NAME}}" && rm -rf -- "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - mkdir -p "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - cp build/darwin/icons.icns "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
      - |
        if [ -f build/darwin/Assets.car ]; then
          cp build/darwin/Assets.car "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Resources"
        fi
      - cp "{{.BIN_DIR}}/{{.APP_NAME}}" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS"
      - cp "build/darwin/Info.dev.plist" "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/Info.plist"
      - xattr -cr "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --force --deep --sign - "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - codesign --verify --deep --strict "{{.BIN_DIR}}/{{.APP_NAME}}.dev.app"
      - '"{{.BIN_DIR}}/{{.APP_NAME}}.dev.app/Contents/MacOS/{{.APP_NAME}}"'

  sign:
    summary: Re-signs Zen.app with SIGN_IDENTITY (default "-", ad-hoc)
    desc: |
      The alpha is ad-hoc signed by `task package`. For a Developer ID signature:
        task darwin:sign SIGN_IDENTITY="Developer ID Application: Name (TEAMID)"
      (adds the hardened runtime and a secure timestamp; notarisation is out of scope).
    cmds:
      - task: codesign

  sign:appstore:
    summary: Re-signs Zen.app for the Mac App Store (sandbox entitlements, "Apple Distribution" identity, embedded profile)
    desc: |
      task darwin:sign:appstore SIGN_IDENTITY="Apple Distribution: Name (TEAMID)" TEAM_ID=... PROFILE=path/to/zen.provisionprofile
    cmds:
      - '{{.TASK_EXE}} darwin:sign CHANNEL=appstore ADHOC="{{.ADHOC}}"'

  sign:notarize:
    summary: Signs the Developer ID .dmg, notarises it with notarytool, staples it and checks it with spctl
    desc: |
      Needs SIGN_IDENTITY ("Developer ID Application: ...") for the bundle and
      KEYCHAIN_PROFILE, a notarytool profile made once with
      `xcrun notarytool store-credentials`. Nothing secret is in the repository.
    vars:
      DMG: '{{.BIN_DIR}}/{{.BUNDLE_NAME}}.dmg'
    preconditions:
      - sh: test "{{.CHANNEL}}" = devid
        msg: "Notarisation is for the Developer ID build; the App Store build goes through Transporter."
      - sh: test "{{.SIGN_IDENTITY}}" != "-"
        msg: "Set SIGN_IDENTITY to your \"Developer ID Application: ...\" identity."
      - sh: test -n "{{.KEYCHAIN_PROFILE}}"
        msg: "Set KEYCHAIN_PROFILE to a notarytool keychain profile (xcrun notarytool store-credentials)."
    cmds:
      - task: package:dmg
      - codesign --force --sign "{{.SIGN_IDENTITY}}" --timestamp "{{.DMG}}"
      - xcrun notarytool submit "{{.DMG}}" --keychain-profile "{{.KEYCHAIN_PROFILE}}" --wait
      - xcrun stapler staple "{{.DMG}}"
      - spctl -a -t open --context context:primary-signature -v "{{.DMG}}"
