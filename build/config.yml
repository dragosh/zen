# zen build configuration. The `info` block is the single source of the product
# name, bundle id, copyright and category that build/darwin/plist writes into
# Info.plist (see specs/packaging/appstore/spec.md).
version: '3'

info:
  companyName: "zen"
  productName: "Zenmark"
  bundleId: "org.zenmark.app"
  description: "Markdown reader and editor"
  copyright: "© 2026 Zenmark authors" # placeholder until the copyright holder is decided
  category: "public.app-category.productivity"
  comments: "Markdown reader and editor"
  version: "0.1.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:
  - ext: md
    name: Markdown
    description: Markdown Document
    iconName: icons
    role: Editor
    mimeType: text/markdown
  - ext: markdown
    name: Markdown
    description: Markdown Document
    iconName: icons
    role: Editor
    mimeType: text/markdown
