# Settings for this site. Edit freely: zen reads this file again when it changes.
version: 1

# Every page uses the docs layout (contents rail, Previous and Next links),
# except the home page.
layout: docs
layouts:
  "README.md": landing

plugins:
  codeblock: true
  diagram: { theme: neutral }

# zenmd build turns this folder into a website you can host anywhere.
export:
  out: _site
