version: '3'

vars:
  APP_NAME: "zenmd"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS.
  GOOS: '{{.GOOS | default OS}}'
  # The app to build (specs/kit/assembly): apps/$APP/app-assembly.yml says what it is made of.
  APP: '{{.APP | default "zenmark"}}'
  # Add-ons of the build (specs/kit/addons): task build|package|release|run|dev [ADDONS=vale].
  # Default: the add-ons of the app's assembly. ADDONS on the command line wins (ADDONS= builds
  # without any); so does a non-empty ADDONS in the environment (an empty one, as CI passes
  # for an unset variable, means the default). Each becomes the Go build tag addon_<id>; the
  # ids that exist are ADDONS_KNOWN.
  ADDONS:
    sh: 'if [ -n "${ADDONS:-}" ]; then printf "%s" "$ADDONS"; else go run ./kit/assembly/cmd/gen -ids-only "apps/{{.APP}}"; fi'
  ADDONS_KNOWN: vale
  # SemVer version, read from the VERSION file (see docs/VERSIONING.md).
  VERSION:
    sh: cat "{{.ROOT_DIR}}/VERSION"
  # Linker flag that stamps the version into every `go build`.
  VERSION_LDFLAGS: '-X github.com/zenmark-org/zenmd/internal/cli.Version={{.VERSION}}'
  # Pinned in .github/workflows/ci.yml too.
  APIDIFF_VERSION: 'v0.0.0-20250106191152-7588d65b2ba8'
  SEMVER_RE: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*)?(\+[0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*)?$'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  package:appstore:
    summary: Builds the sandboxed Mac App Store bundle and .pkg (needs Xcode's actool, an identity and PROFILE; see docs/DISTRIBUTION.md)
    cmds:
      - task: darwin:package:appstore

  run:
    summary: Runs the application (built with `task build`; APP and ADDONS must match that build, by default the assembly's)
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode (the add-ons of the app's assembly; ADDONS=... overrides them)
    # wails3 dev runs `wails3 build DEV=true` and `wails3 task run`, which read APP and ADDONS from the environment.
    env:
      APP: '{{.APP}}'
      ADDONS: '{{.ADDONS}}'
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  test:
    summary: Runs Go and frontend tests
    cmds:
      - task: test:go
      - task: test:frontend

  test:go:
    summary: Runs Go tests
    deps:
      - task: common:build:frontend
    env:
      # Same macOS minimum as the app build (build/darwin/Taskfile.yml),
      # so the linker does not warn about newer object files. macOS only:
      # gcc on Linux rejects the flag.
      CGO_CFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=13.0{{end}}'
      CGO_LDFLAGS: '{{if eq OS "darwin"}}-mmacosx-version-min=13.0{{end}}'
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    cmds:
      # Twice: without add-ons (the default build) and with the vale add-on (specs/kit/addons).
      - go vet ./...
      - go test ./...
      - go vet -tags addon_vale ./...
      - go test -tags addon_vale ./...

  test:frontend:
    summary: Type-checks and tests the frontend
    dir: apps/zenmark/frontend
    deps:
      - task: common:install:frontend:deps
    cmds:
      - npx tsc
      - npm test

  api:check:
    summary: Lists incompatible changes to the public Go API (engine/..., builtins/...) since the latest v* tag; skips when apidiff is not installed
    cmds:
      - |
        if ! command -v apidiff >/dev/null 2>&1; then
          echo "apidiff is not installed, skipping. Install it with:"
          echo "  go install golang.org/x/exp/cmd/apidiff@{{.APIDIFF_VERSION}}"
          exit 0
        fi
        tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
        if [ -z "$tag" ]; then
          echo "no v* tag yet: nothing to compare against"
          exit 0
        fi
        tmp=$(mktemp -d)
        trap 'git worktree remove --force "$tmp/base" 2>/dev/null; rm -rf "$tmp"' EXIT
        git worktree add --detach "$tmp/base" "$tag" >/dev/null
        (cd "$tmp/base" && apidiff -m -w "$tmp/base.api" github.com/zenmark-org/zenmd)
        apidiff -m -incompatible "$tmp/base.api" github.com/zenmark-org/zenmd | tee "$tmp/out"
        if [ -s "$tmp/out" ]; then
          echo "incompatible API changes since $tag: say why with 'api-break: <reason>' in the commit message or PR body"
          exit 1
        fi

  install:
    summary: Builds zenmd and links it (and the zen alias, until 0.4.0) into ~/.local/bin (override with INSTALL_DIR) so `zenmd` works from any directory
    vars:
      INSTALL_DIR: '{{.INSTALL_DIR | default (print .HOME "/.local/bin")}}'
    deps:
      - build
    cmds:
      - go run ./build/darwin/installcli -exe "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}" -dir "{{.INSTALL_DIR}}"

  uninstall:
    summary: Removes the zenmd and zen links created by `task install`
    vars:
      INSTALL_DIR: '{{.INSTALL_DIR | default (print .HOME "/.local/bin")}}'
    cmds:
      - go run ./build/darwin/installcli -exe "{{.ROOT_DIR}}/{{.BIN_DIR}}/{{.APP_NAME}}" -dir "{{.INSTALL_DIR}}" -uninstall

  version:
    summary: Prints the version from the VERSION file
    silent: true
    cmds:
      - echo "{{.VERSION}}"

  version:ldflags:
    summary: Prints the linker flag that stamps the version into builds (used by build/version_test.go)
    silent: true
    cmds:
      - echo "{{.VERSION_LDFLAGS}}"

  version:check:
    summary: Fails if VERSION is not valid SemVer, build/config.yml disagrees with it, or CHANGELOG.md has no Unreleased section
    silent: true
    dir: '{{.ROOT_DIR}}'
    cmds:
      - |
        test "$(wc -l < VERSION | tr -d ' ')" = 1 || { echo "VERSION must be exactly one line" >&2; exit 1; }
        v="$(cat VERSION)"
        printf '%s\n' "$v" | grep -Eq '{{.SEMVER_RE}}' || { echo "VERSION '$v' is not valid SemVer 2.0.0" >&2; exit 1; }
        core="${v%%+*}"; core="${core%%-*}"
        grep -Eq "^  version: \"$core\"" build/config.yml || { echo "build/config.yml info.version must be \"$core\"" >&2; exit 1; }
        grep -Eq '^## \[Unreleased\][[:space:]]*$' CHANGELOG.md || { echo "CHANGELOG.md has no '## [Unreleased]' section" >&2; exit 1; }
        echo "version $v ok"

  version:bump:
    summary: Rewrites VERSION. Usage - task version:bump PART=major|minor|patch|pre
    silent: true
    dir: '{{.ROOT_DIR}}'
    requires:
      vars: [PART]
    cmds:
      - |
        v="$(cat VERSION)"
        printf '%s\n' "$v" | grep -Eq '{{.SEMVER_RE}}' || { echo "VERSION '$v' is not valid SemVer 2.0.0" >&2; exit 1; }
        v="${v%%+*}"
        core="${v%%-*}"
        pre=""
        case "$v" in *-*) pre="${v#*-}" ;; esac
        major="${core%%.*}"; rest="${core#*.}"; minor="${rest%%.*}"; patch="${rest#*.}"
        case "{{.PART}}" in
          major) new="$((major + 1)).0.0" ;;
          minor) new="$major.$((minor + 1)).0" ;;
          patch) new="$major.$minor.$((patch + 1))" ;;
          pre)
            n="${pre##*.}"
            case "$pre" in *.*) ;; *) n="" ;; esac
            case "$n" in ''|*[!0-9]*) echo "cannot bump pre-release of '$v': it does not end in a number (like alpha.1)" >&2; exit 1 ;; esac
            new="$core-${pre%.*}.$((n + 1))" ;;
          *) echo "PART must be major, minor, patch or pre" >&2; exit 1 ;;
        esac
        printf '%s\n' "$new" > VERSION
        sed -i.bak -E "s/^  version: \"[^\"]*\"/  version: \"${new%%-*}\"/" build/config.yml && rm -f build/config.yml.bak
        echo "$v -> $new"

  release:
    summary: Builds the notarised universal DMG for VERSION as bin/Zenmark-<version>.dmg and its .sha256, with the add-ons of ADDONS (needs SIGN_IDENTITY and KEYCHAIN_PROFILE, or NOTARY_KEY, NOTARY_KEY_ID and NOTARY_ISSUER; see docs/DISTRIBUTION.md)
    cmds:
      - task: version:check
      - task: darwin:sign:notarize
        vars: {ARCH: universal}
      - cp "{{.BIN_DIR}}/Zenmark.dmg" "{{.BIN_DIR}}/Zenmark-{{.VERSION}}.dmg"
      - cd "{{.BIN_DIR}}" && shasum -a 256 "Zenmark-{{.VERSION}}.dmg" > "Zenmark-{{.VERSION}}.dmg.sha256"
      - echo "{{.BIN_DIR}}/Zenmark-{{.VERSION}}.dmg is ready (task release:publish uploads it)"

  release:notes:
    summary: Writes the CHANGELOG.md section of VERSION (the GitHub release notes) to bin/release-notes.md
    dir: '{{.ROOT_DIR}}'
    cmds:
      - mkdir -p "{{.BIN_DIR}}"
      - awk -v v="{{.VERSION}}" 'index($0, "## [" v "]") == 1 {f=1; next} f && /^## \[/ {exit} f' CHANGELOG.md > "{{.BIN_DIR}}/release-notes.md"
      - grep -q '[^[:space:]]' "{{.BIN_DIR}}/release-notes.md" || { echo "CHANGELOG.md has no '## [{{.VERSION}}]' section" >&2; exit 1; }
      # The add-ons of the build (ADDONS, the repository variable in CI) are part of the notes.
      - printf '\nAdd-ons in this build:%s\n' "{{if .ADDONS}} {{.ADDONS}}.{{else}} none.{{end}}" >> "{{.BIN_DIR}}/release-notes.md"

  release:publish:
    summary: Uploads bin/Zenmark-<version>.dmg to the GitHub release v<version>, creating it from the tag with the CHANGELOG section as notes
    dir: '{{.ROOT_DIR}}'
    preconditions:
      - sh: test -f "{{.BIN_DIR}}/Zenmark-{{.VERSION}}.dmg"
        msg: "Run task release first."
      - sh: git rev-parse -q --verify "refs/tags/v{{.VERSION}}" >/dev/null
        msg: "Tag v{{.VERSION}} does not exist (git tag v{{.VERSION}} && git push origin v{{.VERSION}})."
    cmds:
      - task: release:notes
      - gh release view "v{{.VERSION}}" >/dev/null 2>&1 || gh release create "v{{.VERSION}}" --verify-tag --title "Zenmark {{.VERSION}}" --notes-file "{{.BIN_DIR}}/release-notes.md"
      - gh release upload "v{{.VERSION}}" "{{.BIN_DIR}}/Zenmark-{{.VERSION}}.dmg" "{{.BIN_DIR}}/Zenmark-{{.VERSION}}.dmg.sha256" --clobber

  install:cli:
    summary: Links the zenmd command (and the zen alias) from the installed Zenmark.app (INSTALL_DIR, APP_PATH override)
    cmds:
      - task: "{{.GOOS}}:install:cli"

  uninstall:cli:
    summary: Removes the zenmd and zen links, only when they point into Zenmark.app (INSTALL_DIR, APP_PATH override)
    cmds:
      - task: "{{.GOOS}}:uninstall:cli"
