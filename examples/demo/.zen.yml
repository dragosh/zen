# Settings for this folder; they override the global config.yml and are
# overridden by a page's frontmatter. Open from the cog > .zen.yml.
version: 1

# Layouts by path, the first match wins. A page's own layout beats these.
layouts:
  "blog/**": post

# zenmd export site: export this folder as a static website (see build/index.md).
build:
  out: _site
  editURL: https://github.com/zenmark-org/zenmd/edit/main/examples/demo/{path}

# MyST directives (```{note}) are read in this folder; see plugins/dialects.md.
markdown:
  dialects: [myst]

plugins:
  codeblock: true
  diagram: { theme: neutral }
  lint: true
