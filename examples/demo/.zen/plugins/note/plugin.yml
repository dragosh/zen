id: note
version: 0.1.0
apiVersion: 1
description: Callout boxes
default: true

blocks: [note, warning, important, attention, hint]

help:
  summary: Callout boxes. A note block draws a note, a warning block a warning; title sets the heading (the default is Note or Warning). The body is plain text turned into HTML by note.sh.
  snippets:
    - title: A note
      markdown: |
        :::note{title="Remember"}
        A backend gets the text of the block and prints HTML.
        :::
    - title: A warning
      markdown: |
        :::warning
        Back up the folder first.
        :::

allow:
  - { element: div, attrs: [class] }

backend:
  command: ["./note.sh"]
  hooks: [block]

frontend:
  css: [note.css]
