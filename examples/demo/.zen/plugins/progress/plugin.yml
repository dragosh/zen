id: progress
version: 0.1.0
apiVersion: 1
description: Checklists that remember what you ticked
default: true

blocks: [progress]

help:
  summary: Checklists that remember what you ticked. Give the block an id that is unique in the page; the ticks are saved on this Mac under that id.
  snippets:
    - title: A checklist
      markdown: |
        :::progress{id=first-plugin}
        - [ ] Read this page
        - [ ] Allow the demo plugins
        - [ ] Copy one and change it
        :::

frontend:
  js: [progress.js]
  css: [progress.css]
